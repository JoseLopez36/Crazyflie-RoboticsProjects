/**/planning_node:
  ros__parameters:
    cell_size: 0.25
    visited:
      update_period: 0.5

/**/darp_node:
  ros__parameters:
    cell_size: 0.25

/**/control_node:
  ros__parameters:
    target_altitude: 2.0
    acceptance_radius: 0.1
    auto_land_on_finish: true
    land_height: 0.03

/**/visualization_node:
  ros__parameters:
    # Agent visualization parameters
    drones:
      position_scale: 0.1
      setpoint_scale: 0.075
      arrow_width: 0.04
      label_scale: 0.2
      z_offset: 0.0025
    # Trajectory visualization parameters
    trajectories:
      line_width: 0.025
      point_scale: 0.05
      alpha: 0.5
    # Zone visualization parameters
    zones:
      cell_size: 0.25
      fill_alpha: 0.05
      outline_width: 0.010

/**/test_node:
  ros__parameters:
    # Simple hardware test: takeoff -> go to (x[i], y[i]) -> land
    target_altitude: 1.0
    acceptance_radius: 0.15
    land_height: 0.03
    takeoff_duration: 2.0
    preflight_setpoints: 15
    rate_hz: 10.0
    takeoff_tolerance: 0.25
    landing_tolerance: 0.05
    takeoff_timeout_sec: 10.0
    goto_timeout_sec: 30.0
    landing_timeout_sec: 15.0
    targets:
      x: [0.0, 3.0]
      y: [3.0, 0.0]