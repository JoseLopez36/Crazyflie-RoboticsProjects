name: hardware
root: ./
startup_window: crazyflies_start
pre_window: |
  source <%= @settings["setup_name"] %>
  source /root/Crazyflie-RoboticsProjects/ros2_ws/install/setup.bash 
  source /opt/ros/humble/setup.bash 
windows:
  - crazyflies_start:
      layout: tiled
      panes:
        - source /root/ros2_ws/install/setup.bash; ros2 launch crazyflie_robotics_projects_pkg hardware_launch.py